# ─── HTTP → HTTPS Redirect ────────────────────────────────────
server {
    listen 80;
    server_name server.devwithabhi.de panel.devwithabhi.de;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── API: server.devwithabhi.de ─────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name server.devwithabhi.de;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream "http://api:3000";

    ssl_certificate /etc/letsencrypt/live/server.devwithabhi.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.devwithabhi.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    location / {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Auth endpoints — stricter rate limiting
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Admin: panel.devwithabhi.de ────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name panel.devwithabhi.de;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $admin_upstream "http://admin:80";

    ssl_certificate /etc/letsencrypt/live/server.devwithabhi.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.devwithabhi.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
